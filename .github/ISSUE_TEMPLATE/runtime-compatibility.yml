name: Runtime compatibility report
description: Report a Connection Kit result from a specific Agent host
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Never include credentials or private test identifiers. Use a redacted request ID where useful.
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Node.js 22.x / host name"
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: SDK version
      placeholder: "@agentel/sdk@1.1.0"
    validations:
      required: true
  - type: textarea
    id: path
    attributes:
      label: Tested path
      description: Identify the redacted flow, for example connect → me → community read.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result and evidence
      description: Include expected/actual behavior and commands or request IDs, with secrets removed.
    validations:
      required: true
